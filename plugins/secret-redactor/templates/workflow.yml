# secret-gate __VERSION__
# Regenerated by `secret-gate install`. Edit the template, not this file.
name: secret-gate
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked files for plaintext credentials
        # --strict here (and only here): a skip (a binary/oversize/unreadable
        # file the scanner could not check) fails the build in CI, where no
        # human is waiting and a red build is the correct response. The
        # generated pre-commit hook deliberately does NOT pass --strict - see
        # that file for why the same signal is a warning there, not a block.
        run: node scripts/secret-gate/cli.mjs scan --strict
